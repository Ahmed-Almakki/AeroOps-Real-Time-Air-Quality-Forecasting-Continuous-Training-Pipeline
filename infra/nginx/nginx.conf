events {}

http {
    auth_basic "Restricted Access";
    auth_basic_user_file /etc/nginx/.htpasswd;

    server {
        listen 80;

        location /reports/ {
            auth_basic off;
            alias /usr/share/nginx/html/reports/;
            autoindex on;  # <--- Add this line
            autoindex_exact_size off; # (Optional) Shows file sizes in KB/MB instead of exact bytes
            autoindex_localtime on; # optional show your localtime instead of utc
        }

        location /mlflow/ {
            proxy_pass http://mlflow_air:5000/;
            proxy_set_header Host $host;
        }

        location /prometheus/ {
            proxy_pass http://prometheus:9090/;
            proxy_set_header Host $host;
        }

        location /alloy/ {
            proxy_pass http://alloy:12345/;
            proxy_set_header Host $host;
        }

        # Catch-all for Prefect.
        # This single block natively handles the UI, /api, /assets, /v2,
        # and all internal SPA routes (like /flow-runs or /deployments).
        location / {
            proxy_pass http://prefect_server:4200/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
