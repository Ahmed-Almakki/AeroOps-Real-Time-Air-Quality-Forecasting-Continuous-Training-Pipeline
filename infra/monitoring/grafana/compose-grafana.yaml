services:
   grafana:
      image: grafana/grafana-oss:latest

      networks:
        - prefect_network
        - default

      ports:
          - 3000:3000

      restart: unless-stopped

      depends_on:
          db:
            condition: service_healthy

      environment:
          GF_DATABASE_TYPE: postgres
          GF_DATABASE_HOST: ${POSTGRES_HOST}:${POSTGRES_PORT}
          GF_DATABASE_NAME: grafana_db
          GF_DATABASE_USER: ${POSTGRES_USER}
          GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}

      volumes:
          - grafana_data:/var/lib/grafana
          - ./config/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yml
          - ./config/dashboard.yaml:/etc/grafana/provisioning/dashboards/dashboard.yaml
          - ./config:/var/lib/grafana/dashboards

volumes:
  grafana_data:
