services:

  loki:
    image: grafana/loki:latest
    container_name: loki

    restart: unless-stopped

    ports:
      - "3100:3100"

    networks:
      - prefect_network
      - default

    healthcheck:
      test: [ "CMD-SHELL", "wget -q --tries=1 -O- http://localhost:3100/ready || exit 1"]
      start_period: 30s
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - chunks:/loki/chunks
      # - rules_directory: /loki/rules
      - ./config/loki_config.yaml:/etc/loki/config.yaml

    command:
      - "-config.file=/etc/loki/config.yaml"
      - "-print-config-stderr"

volumes:
  chunks:
