services:
  nginx:
    image: nginx:latest

    profiles: ["monitoring"]

    ports:
      - "80:80"

    networks:
      - prefect_network
      - default

    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./reports:/usr/share/nginx/html/reports:ro

    depends_on:
      - mlflow_air
      - prefect_server
      - loki
      - prometheus
      - alloy
